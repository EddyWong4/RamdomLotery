<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <!-- Cempasúchil: flores de pétalos en capas y pétalos sueltos, naranja y rosa mexicano muy tenues -->
  <defs>
    <g id="petalos">
      <ellipse cx="0" cy="-15" rx="6" ry="11"/>
      <ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(30)"/>
      <ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(60)"/>
      <ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(90)"/>
      <ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(120)"/>
      <ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(150)"/>
      <ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(180)"/>
      <ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(210)"/>
      <ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(240)"/>
      <ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(270)"/>
      <ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(300)"/>
      <ellipse cx="0" cy="-15" rx="6" ry="11" transform="rotate(330)"/>
    </g>
    <g id="flor">
      <use xlink:href="#petalos" href="#petalos"/>
      <use xlink:href="#petalos" href="#petalos" transform="rotate(15) scale(0.72)"/>
      <circle r="6"/>
    </g>
  </defs>
  <g fill="#ff9f1c" fill-opacity="0.09">
    <use xlink:href="#flor" href="#flor" transform="translate(56 58)"/>
    <use xlink:href="#flor" href="#flor" transform="translate(178 150) scale(1.25)"/>
    <use xlink:href="#flor" href="#flor" transform="translate(62 200) scale(0.7)"/>
    <ellipse cx="150" cy="44" rx="4" ry="8" transform="rotate(35 150 44)"/>
    <ellipse cx="118" cy="112" rx="4" ry="8" transform="rotate(-20 118 112)"/>
    <ellipse cx="220" cy="232" rx="4" ry="8" transform="rotate(60 220 232)"/>
  </g>
  <g fill="#d81e84" fill-opacity="0.09">
    <circle cx="116" cy="190" r="3"/><circle cx="206" cy="66" r="3"/><circle cx="14" cy="130" r="2.5"/>
  </g>
</svg>
